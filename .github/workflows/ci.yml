name: CI y publicacion

# Saca a la persona del camino critico de "acordarse de los 4 archivos".
# Si la version esta desincronizada o el smoke test falla, no se publica.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verificar:
    name: Verificar version y smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm ci || npm install

      # Barato y rapido: corta antes de gastar tiempo en el navegador.
      - name: Verificar que la version este sincronizada
        run: npm run check

      - name: Instalar navegador para Playwright
        run: npx playwright install --with-deps chromium

      - name: Smoke test
        run: npm run smoke
        env:
          OPTRACKER_TEST_EMAIL: ${{ secrets.OPTRACKER_TEST_EMAIL }}
          OPTRACKER_TEST_PASSWORD: ${{ secrets.OPTRACKER_TEST_PASSWORD }}

      - name: Guardar el reporte si algo fallo
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  publicar:
    name: Publicar en GitHub Pages
    needs: verificar
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
