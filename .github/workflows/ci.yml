name: CI y publicacion

# Saca a la persona del camino critico de "acordarse de los 4 archivos".
# Si la version esta desincronizada o el smoke test falla, no se publica.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verificar:
    name: Verificar version y smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm ci || npm install

      - name: Verificar tipos y tests unitarios
        run: |
          npm run typecheck
          npm test

      - name: Build con Vite
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build


      - name: Guardar el reporte si algo fallo
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

# NOTA: el job "publicar" fue ELIMINADO porque entraba en conflicto con
# .github/workflows/deploy.yml (que publica correctamente solo la carpeta dist/).
# Antes subía la raíz del repo (path: .) incluyendo index.html de desarrollo,
# pisando el deploy correcto de Vite en GitHub Pages.
